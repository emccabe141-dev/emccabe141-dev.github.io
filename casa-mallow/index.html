<style>
/* Layout: quiet and flat. One column of whitespace; pastel fills carry the category colour, ink lines carry the structure. No shadows, no gradients. Board widens to four columns on a computer and swipes on a phone. */
:root{
  /* Made by Mallow design system: day theme */
  --bg:#f8f2ee; --surface:#fffaf6; --ink:#4f1a2e; --muted:#6b6465; --line:#e5d9d2; --raise:#f3e9e0;
  --c-coral:#F1D9DC; --c-sun:#F1E5D8; --c-mint:#DDE3EA; --c-sky:#D6DFEA; --c-lilac:#E4DAEA; --c-rose:#EFD8E0; --c-teal:#D7E3E5; --c-slate:#E7E2DE; --c-lime:#E9D9E4;
  --k-coral:#8E2E3F; --k-sun:#7A4A2E; --k-mint:#34476A; --k-sky:#2E4C73; --k-lilac:#5E3F78; --k-rose:#7C2747; --k-teal:#2A5A66; --k-slate:#5E5658; --k-lime:#6E2D5E;
  --done:#4f1a2e; --warn:#a8392b; --accent:#653446; --on-accent:#fffaf6; --focus:#3b5068;
  --m-rose:#d6a7b5; --m-rose-soft:#e7c4ce; --m-mauve:#b39fc0; --m-blue:#3b5068; --m-cream:#f6eee6; --m-door:#653446;
  --display:"Lexend",Verdana,Tahoma,Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Atkinson Hyperlegible Next",Verdana,Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#221a1e; --surface:#2d2328; --ink:#f7ecef; --muted:#bdb3b5; --line:#43363c; --raise:#1a1417;
  --c-coral:#4a2f37; --c-sun:#463a30; --c-mint:#323843; --c-sky:#2f3946; --c-lilac:#3c3243; --c-rose:#4a2f3b; --c-teal:#2e3c3e; --c-slate:#3a3335; --c-lime:#44303f;
  --k-coral:#EBA9B4; --k-sun:#E4C3A4; --k-mint:#AFC0DC; --k-sky:#a3bad4; --k-lilac:#CDB7E0; --k-rose:#e7a9bf; --k-teal:#9ECBD3; --k-slate:#C9C1BE; --k-lime:#DEB0D2;
  --m-rose:#8a4d63; --m-rose-soft:#5a3442; --m-mauve:#6e5b80; --m-blue:#a3bad4; --m-cream:#3a2f33; --m-door:#e7a9bf;
  --done:#f7ecef; --warn:#f2937f; --accent:#e7a9bf; --on-accent:#221a1e; --focus:#a3bad4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#221a1e; --surface:#2d2328; --ink:#f7ecef; --muted:#bdb3b5; --line:#43363c; --raise:#1a1417;
  --c-coral:#4a2f37; --c-sun:#463a30; --c-mint:#323843; --c-sky:#2f3946; --c-lilac:#3c3243; --c-rose:#4a2f3b; --c-teal:#2e3c3e; --c-slate:#3a3335; --c-lime:#44303f;
  --k-coral:#EBA9B4; --k-sun:#E4C3A4; --k-mint:#AFC0DC; --k-sky:#a3bad4; --k-lilac:#CDB7E0; --k-rose:#e7a9bf; --k-teal:#9ECBD3; --k-slate:#C9C1BE; --k-lime:#DEB0D2;
  --m-rose:#8a4d63; --m-rose-soft:#5a3442; --m-mauve:#6e5b80; --m-blue:#a3bad4; --m-cream:#3a2f33; --m-door:#e7a9bf;
  --done:#f7ecef; --warn:#f2937f; --accent:#e7a9bf; --on-accent:#221a1e; --focus:#a3bad4; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:18px/1.55 var(--body);letter-spacing:.02em;word-spacing:.08em;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.lucide{flex:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap.wide{max-width:1180px}
h2{font:700 16px/1.3 var(--body);letter-spacing:.01em;text-transform:none;color:var(--muted);margin:0}
.view,.section,.list{display:grid;grid-template-columns:minmax(0,1fr)}
.view{gap:32px}.section{gap:14px}.list{gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.loading{color:var(--muted);padding:60px 0;text-align:center}
.empty{color:var(--muted);padding:6px 2px;margin:0;font-size:16px}

/* header */
.hello{display:grid;gap:6px}
.casa-row{display:flex;align-items:center;gap:12px}.casa-row svg{flex:none}
.casa-name{font:600 18px/1.2 var(--display);letter-spacing:.01em;color:var(--accent)}
.hello .date,.kicker{font-size:16px;color:var(--muted)}
.hello h1,.title{font:600 clamp(28px,7.5vw,34px)/1.15 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}

/* day strip */
.days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(20px,env(safe-area-inset-left,0px)));padding:0 max(20px,env(safe-area-inset-left,0px))}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:0;border-radius:16px;background:transparent;width:52px;padding:8px 0;display:grid;justify-items:center;gap:4px}
.day small{font-size:12px;color:var(--muted)}
.day b{font:600 19px/1 var(--display)}
.day[aria-pressed="true"]{background:var(--c-lilac)}
.day i.pips{display:none}

/* now */
.now{background:var(--c,var(--raise));border-radius:28px;padding:24px;display:grid;gap:22px}
.now-top{display:flex;gap:20px;align-items:center}
.ring{position:relative;flex:none;width:104px;height:104px}
.ring svg.dial{width:104px;height:104px;transform:rotate(-90deg)}
.ring .track{stroke:color-mix(in srgb,var(--ink) 10%,transparent)}
.ring .left{stroke:var(--ink);transition:stroke-dashoffset .6s}
.ring .icon{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
.now-info{min-width:0;display:grid;gap:4px}
.label{font-size:16px;letter-spacing:.01em;text-transform:none;color:color-mix(in srgb,var(--ink) 55%,transparent)}
.now-title{font:600 clamp(24px,6.5vw,30px)/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.now-time,.now-left{font-size:16px;color:color-mix(in srgb,var(--ink) 65%,transparent)}
.now-left{color:var(--ink)}
.now-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;font-weight:600;padding:12px 20px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.quiet{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink)}
.view>.section>.btn.quiet,.view>.btn.quiet{background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:var(--r)}
.btn.wide{width:100%}
.next{display:flex;gap:14px;align-items:center;padding:4px 2px}
.next.warn{background:var(--c,var(--raise));border-radius:var(--r);padding:12px}
.next .t{font-size:17px;overflow-wrap:anywhere}
.next .s{color:var(--muted);font-size:16px}
.next .soon{color:var(--warn)}

/* tiles */
.tile{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--c,var(--raise));color:var(--ink)}
.tile.sm{width:44px;height:44px;border-radius:14px}

/* timeline */
.timeline{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.slot{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:16px;border-radius:var(--r);padding:8px 4px 8px 8px}
.slot.current{background:var(--raise)}
.slot.past{opacity:.45}
.slot.isdone .t{text-decoration:line-through;text-decoration-thickness:1px}
.slotbtn{display:contents}
.slot .t{font-size:17px;overflow-wrap:anywhere;line-height:1.3;display:block}
.slot .s{color:var(--muted);font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot .time{font-variant-numeric:tabular-nums}
.slot .chip{display:none}
.nowline{display:flex;align-items:center;gap:10px;color:var(--warn);font-size:16px;letter-spacing:.1em;text-transform:none;padding:2px 8px}
.nowline::after{content:"";flex:1;height:1px;background:var(--warn);opacity:.4}
.tick{flex:none;width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;border-radius:14px}
.tick i{width:24px;height:24px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);display:grid;place-items:center;color:var(--bg);font-style:normal;font-size:16px}
.tick.on i{background:var(--done);border-color:var(--done)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--surface) 60%,transparent);color:var(--ink);font-size:16px;white-space:nowrap}

/* board */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(20px,env(safe-area-inset-left,0px)));padding:0 max(20px,env(safe-area-inset-left,0px))}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:transparent;font-size:16px;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.fchip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--raise));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
.fchip[aria-pressed="true"]{background:var(--c,var(--raise));color:var(--ink)}
.fchip[aria-pressed="true"] .dot{display:none}
.fchip.all[aria-pressed="true"]{background:var(--raise)}
.fchip.edit{color:var(--muted)}
.add{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:4px 0;align-items:center}
.add input{flex:1;min-width:0;border:0;background:transparent;padding:12px 2px;font-size:17px;outline:none}
.add .catpick{border:0;border-radius:999px;padding:7px 12px;background:var(--c,var(--raise));font-size:16px;display:inline-flex;align-items:center;max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.add .catpick .dot{display:none}
.add .go{border:0;border-radius:50%;width:38px;height:38px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.colnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(20px,env(safe-area-inset-left,0px)));padding:0 max(20px,env(safe-area-inset-left,0px))}
.colnav::-webkit-scrollbar{display:none}
.colnav button{flex:none;white-space:nowrap;border:0;border-radius:999px;padding:7px 12px;background:transparent;font-size:16px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.colnav button.on{background:var(--raise);color:var(--ink)}
.colnav b{font-weight:400;font-variant-numeric:tabular-nums}
.board{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-12px calc(-1*max(20px,env(safe-area-inset-left,0px))) 0;padding:0 max(20px,env(safe-area-inset-left,0px)) 10px;scroll-padding-inline:max(20px,env(safe-area-inset-left,0px));scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.col{flex:none;width:min(82%,340px);scroll-snap-align:start;border-radius:22px;padding:6px;display:grid;gap:8px;align-content:start;min-height:200px;border:1.5px dashed transparent}
.col.over{border-color:var(--line);background:var(--raise)}
.col-head{display:flex;align-items:center;gap:8px;padding:6px 6px 4px}
.col-head .ci{display:none}
.col-head b{font:600 16px/1 var(--display)}
.col-head .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:16px}
.card{background:var(--c,var(--raise));border-radius:16px;padding:14px 10px 10px 16px;display:grid;gap:8px;cursor:grab}
.card.dragging{opacity:.4}
.card .ct{border:0;background:transparent;text-align:left;padding:0;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.card .cn{color:color-mix(in srgb,var(--ink) 60%,transparent);font-size:16px;margin-top:-4px;overflow-wrap:anywhere}
.card .cf{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.card .cf .sp{flex:1}
.card .chip{padding:0;background:none;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.mv{border:0;background:transparent;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.mv:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.col.done .card{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.col.done .card .ct{text-decoration:line-through;color:var(--muted)}
.col .empty{padding:6px 8px;font-size:16px}
@media (min-width:900px){.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin:-12px 0 0;padding:0}.col{width:auto}.colnav{display:none}}

/* routines */
.routine{display:grid;gap:14px;background:var(--c,var(--raise));border-radius:24px;padding:18px}
.routine .head{display:flex;gap:14px;align-items:center}
.routine .head .tile{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.routine .info{flex:1;min-width:0;display:grid;gap:2px}
.routine .t{font:600 19px/1.2 var(--display)}
.routine .s{color:color-mix(in srgb,var(--ink) 60%,transparent);font-size:16px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip span{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--surface) 55%,transparent);color:color-mix(in srgb,var(--ink) 70%,transparent)}
.strip span.on{background:var(--ink);color:var(--bg)}
.ghost{border:0;background:transparent;color:color-mix(in srgb,var(--ink) 60%,transparent);font-size:16px;padding:10px 6px}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav a{display:grid;justify-items:center;gap:3px;padding:10px 0 12px;color:var(--muted);text-decoration:none;font-size:12px}
nav a[aria-current="page"]{color:var(--ink)}
.navcasa{font-size:11px;line-height:1.05;letter-spacing:0;text-align:center}
nav a[aria-current="page"] svg{background:var(--c-rose);border-radius:10px;box-sizing:content-box;padding:3px 9px;margin:-3px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,22,30,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:26px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:20px;max-height:92%;overflow:auto;grid-template-columns:minmax(0,1fr)}
.sheet h3{font:600 22px/1.2 var(--display);letter-spacing:-.01em;margin:0}
.field{display:grid;gap:8px}
.field>span{font-size:16px;color:var(--muted)}
.field input,.field textarea,.field select{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 2px;font-size:17px;width:100%}
.field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--ink)}
.field textarea{min-height:140px;resize:vertical;line-height:1.6;border:1px solid var(--line);border-radius:14px;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:0;background:transparent;border-radius:999px;padding:8px 0;width:44px;font-size:16px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--c-lilac);color:var(--ink)}
.catchips{display:flex;gap:6px;flex-wrap:wrap}
.catchips button{border:0;border-radius:999px;padding:8px 14px;background:transparent;font-size:16px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.catchips button[style]{background:var(--c);color:var(--ink);box-shadow:none;opacity:.55}
.catchips button[aria-pressed="true"]{opacity:1;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
.icons button{border:0;background:transparent;border-radius:14px;aspect-ratio:1;display:grid;place-items:center;max-width:100%;color:var(--muted)}
.icons button[aria-pressed="true"]{background:var(--c,var(--raise));color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border-radius:999px;padding:3px}
.seg button{border:0;border-radius:999px;background:transparent;padding:9px 4px;color:var(--muted);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.del{border:0;background:transparent;color:var(--warn);padding:12px 4px;font-size:16px}
.del.sure{background:var(--warn);color:var(--bg);border-radius:999px;padding:12px 18px}
.hint{font-size:16px;color:var(--muted);margin:0}
.catrow{display:flex;gap:10px;align-items:center}
.catrow input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;font-size:17px}
.swatch{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--c)}
.xbtn{flex:none;border:0;background:transparent;color:var(--muted);width:40px;height:40px;display:grid;place-items:center}
.palette{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 6px 46px}
.palette button{width:28px;height:28px;border-radius:50%;border:0;background:var(--c)}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}

/* routine runner */
.runner{position:fixed;inset:0;background:var(--c,var(--raise));color:var(--ink);z-index:30;display:grid;grid-template-rows:auto 1fr auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.runner .top,.runner .mid,.runner .bottom{max-width:560px;width:100%;margin:0 auto}
.runner .top{display:grid;gap:14px}
.runner .close{border:0;background:transparent;color:var(--ink);opacity:.6;font-size:16px;padding:8px 0}
.runner .rname{opacity:.6;font-size:16px}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--ink);opacity:.12}
.dots i.on{opacity:.85}
.runner .mid{display:grid;align-content:center;gap:16px}
.runner .big-icon{width:104px;height:104px;border-radius:32px;background:color-mix(in srgb,var(--surface) 60%,transparent);display:grid;place-items:center;color:var(--ink)}
.runner .count{opacity:.7;letter-spacing:.01em;text-transform:none;font-size:16px}
.runner .step{font:600 clamp(32px,9vw,48px)/1.12 var(--display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.runner .then{opacity:.6;font-size:17px}
.runner .clock{font-size:16px;opacity:.8}
.runner .bottom{display:grid;gap:6px}
.runner .next-btn{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:600 20px/1 var(--display);padding:20px}
.runner .back{border:0;background:transparent;color:var(--ink);opacity:.6;padding:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;z-index:25;max-width:calc(100% - 40px);font-size:16px}
.toast button{border:0;background:transparent;color:var(--bg);text-decoration:underline;padding:6px 10px}
/* hour-by-hour timeline */
.tl{position:relative}
.tl .hr{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.tl .hr span{position:absolute;left:0;top:-9px;font-size:12px;line-height:18px;color:var(--muted);background:var(--bg);padding-right:8px;font-variant-numeric:tabular-nums}
.tl .lane{position:absolute;left:46px;right:0;top:0;bottom:0}
.vt{display:grid;gap:8px}
.ribwrap{display:grid;gap:6px;margin-bottom:6px}
.ribbon{position:relative;height:30px;border-radius:12px;background:var(--line);overflow:hidden}
.ribbon i{position:absolute;top:0;bottom:0;background:var(--k,var(--muted));opacity:.85;border-right:2px solid var(--bg)}
.ribbon .gone{position:absolute;left:0;top:0;bottom:0;background:var(--bg);opacity:.6}
.ribbon .mk{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.riblabels{position:relative;height:16px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.riblabels span{position:absolute;top:0;white-space:nowrap}
.riblabels .nowl{color:var(--ink);font-weight:700;transform:translateX(-50%)}
.vtile{position:relative;display:grid;grid-template-columns:86px 60px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 6px 10px 14px;border-radius:22px;background:var(--c,var(--raise));border:3px solid transparent;overflow:hidden;color:var(--ink);box-sizing:border-box}
.vtile.now{border-color:var(--k,var(--ink))}
.vtile.past{opacity:.42}
.vtile .fill{position:absolute;left:0;top:0;bottom:0;background:var(--k,var(--ink));opacity:.16;pointer-events:none}
.vtile>*:not(.fill){position:relative}
.vt-time b{display:block;white-space:nowrap;font:800 20px/1 var(--display);font-variant-numeric:tabular-nums}
.vt-time small{display:block;margin-top:4px;font-size:16px;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.vt-disc{width:60px;height:60px;border-radius:50%;background:var(--k,var(--ink));color:var(--bg);display:grid;place-items:center}
.vt-body{min-width:0;display:grid;gap:4px;border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.vt-body b{font:800 21px/1.15 var(--display);overflow-wrap:anywhere}
.vt-body small{font-size:16px;color:color-mix(in srgb,var(--ink) 65%,transparent)}
.vt-pill{justify-self:start;font:700 16px/1 var(--body);letter-spacing:.01em;text-transform:none;background:var(--k,var(--ink));color:var(--bg);border-radius:999px;padding:5px 10px}
.vtile .tick i{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.vgap{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;font-size:16px;color:var(--muted);border:1.5px dashed var(--line)}
.vgap.now{border-style:solid;border-color:var(--warn);color:var(--ink);font-weight:600}
@media (max-width:420px){.vtile{grid-template-columns:72px 50px minmax(0,1fr) auto;gap:10px;padding-left:10px}.vt-disc{width:50px;height:50px}.vt-time b{font-size:17px}.vt-body b{font-size:19px}}
.ev{position:absolute;border-radius:14px;background:var(--c,var(--raise));padding:6px 4px 6px 10px;display:flex;gap:8px;align-items:flex-start;overflow:hidden;min-width:0;border:1.5px solid var(--bg)}
.ev .evb{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;gap:8px;align-items:flex-start;height:100%;color:var(--ink)}
.ev .ei{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.ev .etx{min-width:0;display:grid;gap:1px}
.ev .et{font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ev .es{font-size:12px;color:color-mix(in srgb,var(--ink) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.short{align-items:center;padding-block:0}
.ev.short .evb{align-items:center}
.ev.short .ei{display:none}
.ev.short .et{-webkit-line-clamp:1;font-size:16px}
.ev.short .es{display:none}
.ev.past{opacity:.45}
.ev.current{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ev.isdone .et{text-decoration:line-through}
.ev .tick{width:34px;height:34px;flex:none}
.ev .tick i{width:20px;height:20px;font-size:11px}
.ev.short .tick{height:26px}
.nowbar{position:absolute;left:40px;right:0;height:0;border-top:2px solid var(--warn);z-index:3;pointer-events:none}
.nowbar::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.allday{display:flex;gap:6px;flex-wrap:wrap}
.allday button{border:0;border-radius:999px;padding:6px 12px;background:var(--c,var(--raise));font-size:16px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calstat{font-size:16px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:-6px}
.calstat .btn{padding:7px 14px;font-size:16px}
.calrow{display:flex;align-items:center;gap:12px;border:0;background:transparent;width:100%;text-align:left;padding:10px 4px;border-radius:12px;font-size:16px}
.calrow .sw{flex:none;width:22px;height:22px;border-radius:7px;background:var(--c);display:grid;place-items:center;color:var(--ink)}
.calrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.calrow[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.calrow[aria-pressed="false"] .sw svg{display:none}
.calrow[aria-pressed="false"] .nm{color:var(--muted)}
.evdetail{display:grid;gap:6px;font-size:16px}
.evdetail .m{color:var(--muted)}
.evdetail a{color:var(--ink)}
/* boys: day types, rotation, picture view */
.day .kdot{display:block;width:8px;height:8px;border-radius:50%;background:var(--c,transparent)}
.daytype{display:flex;align-items:center;gap:12px;background:var(--c,var(--raise));border-radius:var(--r);padding:12px 12px 12px 14px}
.daytype .tile{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.daytype .dt{flex:1;min-width:0;display:grid;gap:2px}
.daytype b{font:600 18px/1.2 var(--display);overflow-wrap:anywhere}
.daytype small{font-size:16px;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.kitem{display:flex;align-items:center;gap:8px;border-radius:var(--r)}
.kitem .kb{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:transparent;text-align:left;padding:4px 2px}
.kitem .t{font-size:17px;display:block;overflow-wrap:anywhere;line-height:1.3}
.kitem .s{font-size:16px;color:var(--muted)}
.kitem.past{opacity:.45}
.tplrow{display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;background:var(--c,var(--raise));border-radius:var(--r);padding:14px 16px;font-size:17px;color:var(--ink)}
.tplrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.tplrow small{color:color-mix(in srgb,var(--ink) 60%,transparent);font-size:16px;white-space:nowrap}
.rot{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.rot .h{font-size:12px;color:var(--muted);text-align:center}
.rot .wk{font-size:16px;color:var(--muted);padding-right:4px;white-space:nowrap}
.rot .rd{height:30px;border-radius:8px;background:var(--c,var(--raise))}
.rot .rd.cur{box-shadow:inset 0 0 0 1.5px var(--ink)}
.rot button{border:0;border-radius:10px;background:var(--c,var(--raise));min-height:52px;font-size:11px;line-height:1.15;padding:4px 2px;color:var(--ink);overflow-wrap:anywhere;overflow:hidden}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{border-radius:999px;padding:3px 10px;font-size:16px;background:var(--c,var(--raise))}
.kid{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.kid>*{max-width:720px;width:100%;margin:0 auto}
.kid .kbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kid .kname{font:600 22px/1.2 var(--display)}
.kid .kday{font-size:16px;color:var(--muted)}
.kid .know{background:var(--c,var(--raise));border-radius:36px;display:grid;justify-items:center;align-content:center;gap:14px;padding:24px;text-align:center;min-height:0}
.kid .kicon{width:min(44vw,190px);aspect-ratio:1;border-radius:44px;background:color-mix(in srgb,var(--surface) 60%,transparent);display:grid;place-items:center}
.kid .kicon svg{width:58%;height:58%}
.kid .ktitle{font:600 clamp(30px,8vw,52px)/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.kid .kdone{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:600 22px/1 var(--display);padding:18px 38px;display:inline-flex;gap:10px;align-items:center}
.kid .knext{display:flex;align-items:center;gap:16px;background:var(--raise);border-radius:24px;padding:12px 16px}
.kid .knext .kn{font:600 22px/1.2 var(--display);display:block;overflow-wrap:anywhere}
.kid .kstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.kid .kstrip::-webkit-scrollbar{display:none}
.kid .kstrip span{flex:none;width:56px;height:56px;border-radius:16px;background:var(--c,var(--raise));display:grid;place-items:center}
.kid .kstrip span.done{opacity:.35}
.kid .kstrip span.now{box-shadow:inset 0 0 0 2px var(--ink)}
.kid .hold{border:0;background:transparent;color:var(--muted);font-size:16px;padding:10px 4px;position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.kid .hold i{position:absolute;left:0;bottom:4px;height:2px;background:var(--ink);width:0}
.kid .hold.on i{width:100%;transition:width 1.5s linear}
/* areas: one dashboard per area of life */
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.atile{border:0;text-align:left;background:var(--c,var(--raise));border-radius:24px;padding:18px;display:grid;gap:10px;color:var(--ink);min-height:132px;align-content:start}
.atile .an{font:600 20px/1.2 var(--display);overflow-wrap:anywhere}
.anums{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:16px;color:color-mix(in srgb,var(--ink) 65%,transparent)}
.anums b{font:600 18px/1 var(--display);color:var(--ink);margin-right:4px}
.anums .late,.anums .late b{color:var(--warn)}
.atile .anext{font-size:16px;color:color-mix(in srgb,var(--ink) 65%,transparent);overflow-wrap:anywhere}
.ahead{background:var(--c,var(--raise));border-radius:28px;padding:22px;display:grid;gap:14px}
.anums.big b{font-size:24px}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
@media (min-width:900px){.dash{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.crow{display:flex;gap:12px;align-items:baseline;border:0;background:transparent;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;color:var(--ink)}
.crow .cd{flex:none;width:112px;font-size:16px;color:var(--muted)}
.crow .cd.late{color:var(--warn)}
.crow .ct2{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.crow small{color:var(--muted)}
.glabel{font-size:16px;color:var(--muted);padding:6px 2px 0}
.info{margin:0;display:grid}
.info div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.info dt{color:var(--muted);font-size:16px;overflow-wrap:anywhere}
.info dd{margin:0;font-size:16px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.info div.solo{grid-template-columns:minmax(0,1fr)}
.info a{color:var(--ink)}
.people{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pcard{background:var(--raise);border-radius:20px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.pcard .pn{border:0;background:transparent;padding:0;text-align:left;font:600 18px/1.2 var(--display);display:flex;gap:6px;align-items:center;color:var(--ink)}
.pnotes{margin:0;font-size:16px;color:color-mix(in srgb,var(--ink) 70%,transparent);white-space:pre-line;overflow-wrap:anywhere}
.ptask{border:0;text-align:left;background:var(--surface);border-radius:12px;padding:8px 10px;font-size:16px;color:var(--ink);overflow-wrap:anywhere}
.card .chip.late{color:var(--warn)}
/* external brain: capture button, inbox, notes, search */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
nav a{position:relative}
.nbadge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:var(--bg);font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 2px;font-size:17px;outline:none;color:var(--ink)}
.crow .sub{display:block;font-size:16px;color:var(--muted)}
.irow{background:var(--raise);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.irow p{margin:0;overflow-wrap:anywhere;white-space:pre-line;font-size:16px}
.iact{display:flex;gap:6px;flex-wrap:wrap}

const roomsSorted=()=>[...S.rooms].sort((a,b)=>(a.order??99)-(b.order??99)||(a.name||'').localeCompare(b.name||''));
function cleanState(r){const c=r.clean||{},t=todayStr(),ev=+c.every||12;if(!c.last)return{txt:'No deep clean recorded yet',due:false,none:true,frac:0,next:''};
  const next=addDays(c.last,ev*7),left=dayDiff(t,next),frac=Math.max(0,Math.min(1,dayDiff(c.last,t)/(ev*7)));
  return{next,left,frac,due:left<=0,soon:left>0&&left<=14,txt:left<0?`Deep clean was due ${-left} day${left===-1?'':'s'} ago`:left===0?'Deep clean due today':`Next deep clean in ${left<14?left+' days':Math.round(left/7)+' weeks'}`}}
const roomsDue=()=>roomsSorted().filter(r=>cleanState(r).due);

      ${items.length?`<div>${items.map(x=>`<button class="ditem ${x.done?'on':''}" data-ritem="${x.id}"><i class="bx">${x.done?'✓':''}</i><span>${esc(x.text)}</span></button>`).join('')}</div>`:''}
      <button class="btn primary" id="cleanDone">${ico('check',20)} Deep cleaned today</button></section>
    <section class="rbox"><div class="rh">${ico('spray-can',20)}<h2>Regular cleaning</h2><button class="ghost" data-newchore="${r.id}">Add</button></div>${(()=>{const l=(cDoc().chores||[]).filter(c=>c.room===r.id).map(c=>({...c,next:cNext(c),late:dayDiff(cNext(c),todayStr())}));return l.length?`<div class="clist">${l.map(c=>choreRow(c,c.next<=todayStr())).join('')}</div>`:'<p class="empty">No regular jobs for this room yet.</p>'})()}</section>

      <p><b>${dc?esc(dc[1]):'Not set yet'}</b>${d.last?` · last decorated ${esc(d.last)}`:''}</p>

    <section class="rbox"><div class="rh">${ico('lightbulb',20)}<h2>Lighting</h2><button class="ghost" id="newLight">Add</button></div>
      ${(r.lights||[]).length?`<div>${r.lights.map(l=>{const k=lkind(l.kind);return `<button class="trow" data-rlight="${l.id}"><span class="tile sm" style="${cvar(r.color||'lilac')}">${ico(k[2],20)}</span><span class="tm"><b>${+l.count>1?l.count+' × ':''}${esc(k[1])}${l.smart?' · '+esc(l.smart):''}</b><small>${[l.detail,l.fitting?'Fitting '+l.fitting:'',l.notes].filter(Boolean).map(esc).join(' · ')||'Tap to add details'}</small></span>${ico('chevron-right',18)}</button>`}).join('')}</div>`:'<p class="empty">No lights added yet.</p>'}</section>

    ${(()=>{const ids=(r.apps||[]).map(a=>'app:'+r.id+':'+a.id),pp=S.policies.filter(x=>(x.covers||[]).some(c=>ids.includes(c))||['home','contents'].includes(x.type));return pp.length?`<section class="rbox"><div class="rh">${ico('shield-check',20)}<h2>Insurance</h2></div><div>${pp.map(polRow).join('')}</div></section>`:''})()}
    ${jobs.length?`<section class="rbox"><div class="rh">${ico('list-checks',20)}<h2>Jobs that mention this room</h2></div><div class="list">${jobs.map(x=>card(x,true)).join('')}</div></section>`:''}
  </div>`}
const guessApp=n=>{const s=(n||'').toLowerCase();return /fridge|freezer/.test(s)?'refrigerator':/wash|dryer/.test(s)?'washing-machine':/microwave/.test(s)?'microwave':/oven|hob|cooker/.test(s)?'cooking-pot':/kettle|coffee/.test(s)?'coffee':/tv|telly/.test(s)?'tv':/fan|heater|radiator/.test(s)?'fan':/hoover|vacuum/.test(s)?'wind':/dishwasher/.test(s)?'droplets':'plug'};
function updRoom(id,fn){const r=roomOf(id);if(!r)return null;const before=JSON.parse(JSON.stringify(r)),c=JSON.parse(JSON.stringify(r));fn(c);put('rooms',c);return before}

function saveRoomSheet(){const e=editing,v=i=>($('#'+i)?.value||'').trim();
  if(e.kind==='room'){const name=v('fTitle');if(!name){$('#fTitle').focus();return true}const old=roomOf(e.id)||{lights:[],apps:[],decor:{},clean:{every:12,items:CLEAN_DEFAULT.map(text=>({id:uid(),text,done:false}))},order:S.rooms.length};const id=e.id||uid();
    put('rooms',{...old,id,name,purpose:v('fPurpose'),floor:v('fFloor'),notes:v('fText'),icon:e.icon,color:e.color});if(!e.id){roomOpen=id;areaOpen='__rooms'}closeSheet();render();return true}
  if(e.kind==='decor'){updRoom(e.id,c=>{c.decor={status:e.status,colours:v('fCol'),last:v('fLast'),ideas:v('fText')}});closeSheet();return true}
  if(e.kind==='clean'){const lines=v('fText').split('\n').map(x=>x.trim()).filter(Boolean);updRoom(e.id,c=>{const old=(c.clean||{}).items||[];c.clean={...(c.clean||{}),last:$('#fLast').value,every:Math.max(1,+$('#fEvery').value||12),items:lines.map(text=>old.find(o=>o.text===text)||{id:uid(),text,done:false})}});closeSheet();return true}
  if(e.kind==='rlight'){const it={id:e.id||uid(),kind:e.lk,count:Math.max(1,+v('fCount')||1),smart:v('fSmart')==='Not smart'?'':v('fSmart'),fitting:v('fFit'),detail:v('fDetail'),notes:v('fText')};updRoom(e.rid,c=>{c.lights=c.lights||[];const i=c.lights.findIndex(x=>x.id===it.id);if(i<0)c.lights.push(it);else c.lights[i]=it});closeSheet();return true}
  if(e.kind==='rapp'){const name=v('fTitle');if(!name){$('#fTitle').focus();return true}const it={id:e.id||uid(),name,make:v('fMake'),model:v('fModel'),serial:v('fSerial'),bought:$('#fBought').value,warranty:$('#fWar').value,from:v('fFrom'),notes:v('fText')};updRoom(e.rid,c=>{c.apps=c.apps||[];const i=c.apps.findIndex(x=>x.id===it.id);if(i<0)c.apps.push(it);else c.apps[i]=it});closeSheet();return true}
  return false}

  return false}

function trackChart(kind,days){const t=todayStr(),start=addDays(t,-(days-1)),W=300,H=120,L=24,R=6,T=8,B=18,iw=W-L-R,ih=H-T-B;
  const xs=d=>L+dayDiff(start,d)/(days-1)*iw;const ls=logsOf(kind).filter(x=>x.date>=start);const byD={};ls.forEach(x=>{(byD[x.date]=byD[x.date]||[]).push(+x.value)});
  let lo,hi,ticks;if(kind==='mood'){lo=1;hi=5;ticks=[1,3,5]}else if(kind==='pain'){lo=0;hi=10;ticks=[0,5,10]}else{const v=ls.map(x=>+x.value);lo=Math.min(36,...v)-0.2;hi=Math.max(38,...v)+0.2;ticks=[36,37,38].filter(x=>x>=lo&&x<=hi)}
  const ys=v=>T+ih-(v-lo)/(hi-lo)*ih;const days2=Object.keys(byD).sort();
  const col=kind==='mood'?'var(--k-lilac)':kind==='pain'?'var(--k-coral)':'var(--k-sky)';
  const grid=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-4}" y="${ys(v)+3}" text-anchor="end">${v}${kind==='temp'?'°':''}</text>`).join('');
  const marks=logsOf('medchange').filter(x=>x.date>=start).map(x=>`<line x1="${xs(x.date)}" x2="${xs(x.date)}" y1="${T}" y2="${T+ih}" stroke="var(--accent)" stroke-dasharray="3 3"/><circle cx="${xs(x.date)}" cy="${T}" r="3" fill="var(--accent)"><title>${esc(x.note)}</title></circle>`).join('');
  let body='';
  if(kind==='pain')body=days2.map(d=>{const v=Math.max(...byD[d]);return `<rect x="${xs(d)-3}" y="${ys(v)}" width="6" height="${Math.max(1,ys(0)-ys(v))}" rx="2" fill="${col}" opacity=".8"><title>${fd(d)}: worst ${v}</title></rect>`}).join('');
  else{const pts=days2.map(d=>{const a=byD[d].reduce((x,y)=>x+y,0)/byD[d].length;return[xs(d),ys(a),d,a]});
    body=(pts.length>1?`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:'')+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${col}"><title>${fd(p[2])}: ${kind==='temp'?p[3].toFixed(1)+'°C':p[3].toFixed(1)}</title></circle>`).join('')}
  const xl=[start,addDays(start,Math.floor((days-1)/2)),t].map(d=>`<text x="${xs(d)}" y="${H-4}" text-anchor="middle">${fmt(d,{day:'numeric',month:'short'})}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind} over the last ${days} days">${grid}${marks}${body}${xl}</svg>${ls.length?'':'<p class="empty">Nothing logged in the last '+days+' days yet.</p>'}`}

  const m=f('mood'),p=f('pain'),te=f('temp'),mc=f('medchange');const tagc={};[...m,...p].forEach(x=>(x.tags||[]).forEach(g=>tagc[g]=(tagc[g]||0)+1));

/* ---------- groceries: Morrisons and Iceland online ---------- */
const lcN=n=>/^[A-Z]{2,}\b/.test(n)?n:n.charAt(0).toLowerCase()+n.slice(1);
const STORES=[['morrisons','Morrisons','mint'],['iceland','Iceland','sky'],['either','Either','slate']];
const GCATS=['Fruit and veg','Fridge','Freezer','Cupboard','Bread and bakery','Drinks','Kids’ lunches and snacks','Toiletries','Cleaning and household','Other'];
let gStore='morrisons';
const gDoc=()=>S.settings.find(x=>x.id==='grocery')||{id:'grocery',morrisons:{every:7,lead:3,last:''},iceland:{every:14,lead:2,last:''}};
function gNext(k){const o=gDoc()[k]||{};if(!(+o.every>0))return null;const t=todayStr();let n=o.last?(o.last>=t?o.last:addDays(o.last,+o.every)):'';if(!n)return{none:true};while(n<t)n=addDays(n,+o.every);return{next:n,left:dayDiff(t,n),book:addDays(n,-(+o.lead||0)),bookLeft:dayDiff(t,addDays(n,-(+o.lead||0)))}}
const gNeed=k=>S.groceries.filter(x=>x.need&&(x.store===k||(k!=='either'&&x.store==='either'))).sort((a,b)=>GCATS.indexOf(a.cat)-GCATS.indexOf(b.cat)||(a.name||'').localeCompare(b.name||''));
function gNudges(){const out=[];STORES.slice(0,2).forEach(([k,n,c])=>{const x=gNext(k);if(x&&!x.none&&x.bookLeft<=0&&x.left>=0&&!(gDoc()[k]||{}).booked)out.push(`<button data-gogroc="${k}" style="${cvar(c)}">${ico('shopping-cart',16)} ${n}: book your delivery for ${fd(x.next,{weekday:'short',day:'numeric'})}</button>`)});return out}
function storeCard(k,n,c){const o=gDoc()[k]||{},x=gNext(k),need=gNeed(k);
  return `<button class="rtile" data-gstore="${k}" style="${cvar(c)};min-height:0" aria-pressed="${gStore===k}"><span class="row" style="width:100%"><b>${n}</b>${gStore===k?ico('check',18):''}</span>
    <small>${x&&!x.none?(o.booked&&o.booked===x.next?`Booked for ${fd(x.next)}`:x.bookLeft<=0?`<b style="color:var(--warn)">Book now</b> for ${fd(x.next)}`:`Next delivery ${fd(x.next)} · book in ${x.bookLeft} day${x.bookLeft===1?'':'s'}`):'Set your delivery pattern'}</small>
    <span class="rchips"><span class="rchip">${ico('shopping-basket',12)} ${need.length} on the list</span></span></button>`}
function groceryDash(){const k=gStore,need=gNeed(k),staples=S.groceries.filter(x=>x.staple&&(x.store===k||x.store==='either')&&!x.need),o=gDoc()[k]||{},x=gNext(k),sn=STORES.find(s=>s[0]===k)[1];
  const groups={};need.forEach(i=>{(groups[i.cat||'Other']=groups[i.cat||'Other']||[]).push(i)});
  return `<div class="view"><button class="ghost" id="areaBack" style="justify-self:start;display:inline-flex;align-items:center;gap:4px">${ico('chevron-left',18)} Areas</button>
    <div class="ahead" style="${cvar('mint')}"><div class="title">Groceries</div><div class="kicker" style="color:var(--ink)">Online shops at Morrisons and Iceland. Add things as you run out, then order in one go.</div></div>
    <div class="rtiles">${STORES.slice(0,2).map(([a,b,c])=>storeCard(a,b,c)).join('')}</div>
    ${snackCard()}
    <section class="rbox"><div class="rh">${ico('camera',20)}<h2>What’s in the cupboards?</h2></div><p class="hint" style="color:var(--ink)">Take photos of the cupboards, fridge and freezer and send them to Claude in your Life Admin chat with “update my shopping list”. Claude will see what’s running low and add it to the right shop.</p></section>
    <div class="add"><input id="gAdd" placeholder="Add to ${esc(sn)} list…" autocomplete="off" aria-label="Add an item"><button class="go" id="gAddBtn" aria-label="Add">${ico('plus',20)}</button></div>
    <section class="section"><div class="row"><h2>${esc(sn)} list · ${need.length}</h2>${need.length?`<button class="ghost" data-gordered="${k}">Mark all ordered</button>`:''}</div>
      ${need.length?Object.entries(groups).map(([g,l])=>`<div><p class="hint" style="margin:8px 0 2px">${esc(g)}</p>${l.map(i=>`<div class="ditem on" style="padding:4px 2px"><button class="ditem" data-gtog="${i.id}" style="padding:4px 0;flex:1"><i class="bx" style="background:transparent;border-color:color-mix(in srgb,var(--ink) 30%,transparent)"></i><span style="text-decoration:none;color:var(--ink)">${esc(i.name)}${i.qty?` <small class="hint">× ${esc(i.qty)}</small>`:''}${i.store==='either'?' <small class="hint">(either)</small>':''}</span></button><button class="xbtn" data-gedit="${i.id}" aria-label="Edit ${esc(i.name)}">${ico('pencil',16)}</button></div>`).join('')}</div>`).join(''):'<p class="empty">Nothing on the list yet.</p>'}</section>
    ${staples.length?`<section class="section"><div class="row"><h2>Usual items not on the list</h2><button class="ghost" data-gaddall="${k}">Add all</button></div><div class="nudges">${staples.map(i=>`<button data-gtog="${i.id}" style="${cvar('slate')}">${ico('plus',14)} ${esc(i.name)}</button>`).join('')}</div></section>`:''}
    <section class="rbox"><div class="rh">${ico('calendar-clock',20)}<h2>${esc(sn)} delivery plan</h2><button class="ghost" data-gplan="${k}">Change</button></div>
      <p>${+o.every>0?`Delivery every ${+o.every===7?'week':+o.every===14?'2 weeks':o.every+' days'}${o.day?' on '+esc(o.day):''}${o.slot?', '+esc(o.slot):''}. Book ${+o.lead||0} day${+o.lead===1?'':'s'} before.`:'No pattern set.'}</p>
      ${x&&!x.none?`<p class="hint" style="color:var(--ink)">Next delivery ${fd(x.next,{weekday:'long',day:'numeric',month:'short'})}${o.booked===x.next?' · booked':''}</p>`:''}

      ${o.notes?`<p class="hint" style="white-space:pre-line">${esc(o.notes)}</p>`:''}</section>
    <p class="hint">Tick items off as they go in your online basket. Mark something as a usual item and it comes back as a one-tap suggestion after each order.</p></div>`}
function editGItem(id){const i=S.groceries.find(x=>x.id===id);if(!i)return;editing={kind:'gitem',id,store:i.store||gStore,cat:i.cat||'Other',staple:!!i.staple};
  sheet(`<h3>${esc(i.name)}</h3><label class="field"><span>Item</span><input id="fTitle" value="${esc(i.name)}"></label><label class="field"><span>How many</span><input id="fQty" value="${esc(i.qty||'')}" placeholder="2"></label>
  <div class="field"><span>Shop</span><div class="catchips">${STORES.map(([k,n,c])=>`<button type="button" data-gis="${k}" aria-pressed="${editing.store===k}" style="${cvar(c)}">${n}</button>`).join('')}</div></div>

function editGPlan(k){const o=gDoc()[k]||{},n=STORES.find(s=>s[0]===k)[1];editing={kind:'gplan',k};
  sheet(`<h3>${n} delivery plan</h3><div class="two"><label class="field"><span>Delivery every (days)</span><input id="gEvery" type="number" min="0" max="60" value="${esc(o.every??7)}"></label><label class="field"><span>Last or next delivery</span><input id="gLast" type="date" value="${esc(o.last||'')}"></label></div>

  <p class="hint">Set “every” to 0 for no regular delivery.</p><div class="actions"><span></span><button class="btn primary">Save</button></div>`)}
function updG(k,fn){const d=JSON.parse(JSON.stringify(gDoc()));d[k]=d[k]||{};fn(d[k]);put('settings',d)}
function saveGrocSheet(){const e=editing;if(!e||!['gitem','gplan'].includes(e.kind))return false;
  if(e.kind==='gitem'){const i=S.groceries.find(x=>x.id===e.id);put('groceries',{...i,name:$('#fTitle').value.trim()||i.name,qty:$('#fQty').value.trim(),store:e.store,cat:e.cat,staple:e.staple});closeSheet();return true}

function delGrocThing(){const e=editing;if(!e||e.kind!=='gitem')return false;const x=S.groceries.find(i=>i.id===e.id);drop('groceries',e.id);closeSheet();toast('Removed.',()=>put('groceries',x));return true}
const gGuessCat=n=>{const s=n.toLowerCase();return /ice cream|frozen|chips|peas|fish fingers|pizza/.test(s)?'Freezer':/milk|cheese|yog|butter|ham|chicken|eggs|cream/.test(s)?'Fridge':/apple|banana|grape|orange|potato|carrot|onion|salad|tomato|berries|veg|fruit/.test(s)?'Fruit and veg':/bread|roll|wrap|bagel/.test(s)?'Bread and bakery':/juice|squash|water|coffee|tea\b/.test(s)?'Drinks':/crisps|snack|lunch|biscuit/.test(s)?'Kids’ lunches and snacks':/shampoo|toothpaste|soap|deodorant|tampon|razor/.test(s)?'Toiletries':/bleach|washing|dishwasher|bin bag|kitchen roll|toilet roll|spray/.test(s)?'Cleaning and household':/pasta|rice|tin|cereal|sauce|beans|flour|sugar/.test(s)?'Cupboard':'Other'};
function grocAdd(){const el=$('#gAdd');const lines=(el.value||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return;
  lines.forEach(n=>{const ex=S.groceries.find(x=>(x.name||'').toLowerCase()===n.toLowerCase());if(ex)put('groceries',{...ex,need:true,store:ex.store==='either'?'either':gStore});else put('groceries',{id:uid(),name:n,store:gStore,cat:gGuessCat(n),need:true,staple:false,qty:''})});el.value='';setTimeout(()=>$('#gAdd')?.focus(),50)}
function grocClick(b,d){
  if(d.gogroc){gStore=d.gogroc;areaOpen='__groc';location.hash='areas';window.scrollTo(0,0);return true}
  if(d.gstore){gStore=d.gstore;render();return true}

  if(d.gaddall){S.groceries.filter(x=>x.staple&&!x.need&&(x.store===d.gaddall||x.store==='either')).forEach(i=>put('groceries',{...i,need:true}));return true}
  if(d.gordered){const k=d.gordered,l=gNeed(k),before=l.map(x=>({...x}));l.forEach(i=>put('groceries',{...i,need:false,lastBought:todayStr()}));updG(k,o=>{const x=gNext(k);if(x&&!x.none)o.booked=x.next});toast('Order done. Usual items will be suggested next time.',()=>before.forEach(x=>put('groceries',x)));return true}
  if(d.gbooked){const k=d.gbooked,x=gNext(k);updG(k,o=>{o.booked=x&&!x.none?x.next:''});toast('Slot booked.');return true}
  if(d.gplan){editGPlan(d.gplan);return true}
  if(d.gis){editing.store=d.gis;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return true}
  if(d.gic){editing.cat=d.gic;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return true}
  if(d.gist){editing.staple=d.gist==='1';b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return true}

      ${sw.away.length?`<p>Put away: ${esc(sw.away.map(i=>`${pname2(i.who)}’s ${i.name||ccat(i.cat)[1]}`).join(', '))}</p><button class="btn quiet" data-cswap="away">${ico('check',16)} All put away</button>`:''}</section>`:''}

function editCloth(id,cat){const i=id?S.clothes.find(x=>x.id===id):null;const who=i?.who||clothesWho,c=i?.cat||cat||'tops';editing={kind:'cloth',id,who,cat:c,status:i?.status||'out',season:i?.season||''};

const VST=[['idea','To sell','circle-dashed','slate'],['photo','Photographed','camera','sky'],['listed','Listed','tag','lilac'],['sold','Sold, to post','package','rose'],['done','Done','check-circle-2','mint']];

function vStats(){const t=todayStr(),wk=addDays(t,-((isoDay(t)+6)%7)),mon=t.slice(0,7),yr=t.slice(0,4);
  const listedWk=S.sell.filter(x=>x.listedOn&&x.listedOn>=wk).length,earned=f=>S.sell.filter(x=>x.soldOn&&f(x.soldOn)).reduce((n,x)=>n+(parseFloat(x.soldFor)||0),0);

  let streak=0;for(let k=1;k<52;k++){const a=addDays(wk,-7*k),b=addDays(wk,-7*(k-1));if(S.sell.some(x=>x.listedOn&&x.listedOn>=a&&x.listedOn<b))streak++;else break}
  return{listedWk,month:earned(d=>d.slice(0,7)===mon),year:earned(d=>d.slice(0,4)===yr),toPost,stale,streak:streak+(listedWk?1:0)}}
function vintedNudge(){const v=vStats();return v.toPost.length?`<button data-govinted style="${cvar('rose')}">${ico('package',16)} Vinted: ${v.toPost.length} sold, to post${(()=>{const d=v.toPost.map(x=>x.postBy).filter(Boolean).sort()[0];return d?' by '+fd(d,{weekday:'short',day:'numeric'}):''})()}</button>`:''}

let hobSeeding=false,hobOpen=null;
const HOB_ICONS=['languages','music','palette','book-open','dumbbell','bike','camera','flower-2','chef-hat','scissors','gamepad-2','pen-tool'];
const hobLogs=id=>logsOf('hobby').filter(l=>l.hobby===id);
function hobWeek(id){const t=todayStr(),wk=addDays(t,-((isoDay(t)+6)%7));return hobLogs(id).filter(l=>l.date>=wk).reduce((n,l)=>n+(+l.mins||0),0)}
function hobStreak(id){const days=new Set(hobLogs(id).map(l=>l.date));let d=todayStr(),n=0;if(!days.has(d))d=addDays(d,-1);while(days.has(d)){n++;d=addDays(d,-1)}return n}
function seedHobbies(){if(hobSeeding||S.settings.find(x=>x.id==='hobbies')?.seeded||!ready)return;hobSeeding=true;setTimeout(()=>{
  [].forEach(([id,name,icon,color,goal,notes])=>{if(!S.hobbies.some(h=>h.id===id))put('hobbies',{id,name,who:'me',icon,color,goal,notes,resources:'',next:'',created:Date.now()})});
  put('settings',{id:'hobbies',seeded:true})},0)}
function hobCard(h){const wk=hobWeek(h.id),g=+h.goal||0,st=hobStreak(h.id),ls=hobLogs(h.id),open=hobOpen===h.id;
  return `<article class="plan" style="${cvar(h.color||'sky')}"><button class="plhead" data-hobopen="${h.id}" aria-expanded="${open}"><span class="an">${ico(h.icon||'sparkles',20)} ${esc(h.name)}${h.who&&h.who!=='me'?` <small class="hint">· ${esc(pname2(h.who))}</small>`:''}</span>
    <span class="anext">This week: <b>${wk}</b>${g?` of ${g}`:''} minutes${st>1?` · ${st} days in a row`:''}</span>${g?`<span class="bar" aria-hidden="true"><i style="width:${Math.min(100,Math.round(wk/g*100))}%"></i></span>`:''}
    ${h.next?`<span class="anext">Next: ${esc(h.next)}</span>`:''}</button>
    <div class="plbody"><div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">${[10,15,30].map(m=>`<button class="btn quiet" data-hoblog="${h.id}:${m}">${ico('plus',16)} ${m} min</button>`).join('')}<button class="btn quiet" data-hoblog="${h.id}:">Other</button></div>
    ${open?`${h.notes?`<p class="hint" style="color:var(--ink);margin:0">${esc(h.notes)}</p>`:''}${h.resources?`<p class="hint" style="color:var(--ink);margin:0"><b>Using:</b> ${esc(h.resources)}</p>`:''}
      <h2 style="margin-top:6px">Recent practice</h2>${ls.length?`<div class="psteps">${ls.slice(0,8).map(l=>`<button class="pstep" data-hobl="${l.id}">${ico('check-circle-2',18)}<span>${fd(l.date)} · ${+l.mins||0} min${l.note?` · ${esc(l.note)}`:''}</span></button>`).join('')}</div>`:'<p class="empty">Nothing logged yet. Any amount counts.</p>'}
      <button class="btn quiet" data-hobedit="${h.id}" style="justify-self:start">${ico('pencil',16)} Edit</button>`:''}</div></article>`}
function hobbiesDash(){seedHobbies();const hs=[...S.hobbies].sort((a,b)=>(a.created||0)-(b.created||0));const tot=hs.reduce((n,h)=>n+hobWeek(h.id),0);
  return `<div class="view"><button class="ghost" id="areaBack" style="justify-self:start;display:inline-flex;align-items:center;gap:4px">${ico('chevron-left',18)} Areas</button>
    <div class="ahead" style="${cvar('lilac')}"><div class="title">Hobbies</div><div class="anums big"><span><b>${tot}</b>minutes this week</span><span><b>${hs.length}</b>hobb${hs.length===1?'y':'ies'}</span></div><div class="kicker" style="color:var(--ink)">Time just for you. A few minutes still counts, and a missed week doesn’t undo anything.</div></div>
    <div class="list">${hs.map(hobCard).join('')||'<p class="empty">No hobbies yet.</p>'}</div>
    <button class="btn quiet" data-hobedit="" style="justify-self:start">${ico('plus',16)} Add a hobby</button></div>`}
function editHobby(id){const h=id?S.hobbies.find(x=>x.id===id):null;editing={kind:'hobby',id,icon:h?.icon||'sparkles',who:h?.who||'me',color:h?.color||'sky'};
  sheet(`<h3>${h?esc(h.name):'New hobby'}</h3><label class="field"><span>Hobby</span><input id="fTitle" value="${esc(h?.name||'')}" placeholder="Swimming, piano, pottery" required></label>
  <div class="field"><span>Whose</span><div class="catchips">${CWHO().map(([k,n])=>`<button type="button" data-hobwho="${k}" aria-pressed="${editing.who===k}" style="${cvar('slate')}">${esc(n)}</button>`).join('')}</div></div>
  <div class="field"><span>Picture</span><div class="catchips">${HOB_ICONS.map(k=>`<button type="button" data-hobico="${k}" aria-pressed="${editing.icon===k}" aria-label="${k}" style="${cvar('lilac')}">${ico(k,18)}</button>`).join('')}</div></div>
  <label class="field"><span>Weekly goal in minutes (optional)</span><input id="hGoal" type="number" min="0" step="5" value="${esc(h?.goal||'')}"></label>
  <label class="field"><span>What’s next (a lesson, a piece, a chapter)</span><input id="hNext" value="${esc(h?.next||'')}"></label>
  <label class="field"><span>What you use (apps, books, teacher, class)</span><input id="hRes" value="${esc(h?.resources||'')}"></label>
  <label class="field"><span>Notes</span><textarea id="hNotes" rows="2">${esc(h?.notes||'')}</textarea></label>
  <div class="actions">${h?delBtn():'<span></span>'}<button class="btn primary">Save</button></div>`)}
function logHobby(id,mins){const h=S.hobbies.find(x=>x.id===id);if(!h)return;
  if(mins){saveLog({kind:'hobby',hobby:id,mins});const wk=hobWeek(id);toast(`${mins} minutes of ${h.name} logged. ${wk} this week.`);return}
  editing={kind:'hoblog',hobby:id};sheet(`<h3>${esc(h.name)}</h3><div class="two"><label class="field"><span>Minutes</span><input id="hMins" type="number" min="1" step="1" value="20" required></label><label class="field"><span>Day</span><input id="hDay" type="date" value="${todayStr()}"></label></div><label class="field"><span>What you did (optional)</span><input id="hNote" placeholder="Lesson 12, scales, Duolingo"></label><div class="actions"><span></span><button class="btn primary">Save</button></div>`)}
function saveHobbySheet(){const e=editing;if(!e||!['hobby','hoblog','hoblogedit'].includes(e.kind))return false;
  if(e.kind==='hoblog'||e.kind==='hoblogedit'){const m=+$('#hMins').value||0;if(!m){$('#hMins').focus();return true}const d=$('#hDay').value||todayStr();const old=e.kind==='hoblogedit'?S.logs.find(l=>l.id===e.id):{};
    saveLog({...old,id:old.id,kind:'hobby',hobby:e.hobby,mins:m,note:$('#hNote').value.trim(),at:d===todayStr()&&!old.id?undefined:d+'T12:00:00.000Z'});closeSheet();return true}
  const n=$('#fTitle').value.trim();if(!n){$('#fTitle').focus();return true}const h=e.id?S.hobbies.find(x=>x.id===e.id):{id:uid(),created:Date.now(),color:PCOL[S.hobbies.length%PCOL.length]};
  put('hobbies',{...h,name:n,who:e.who,icon:e.icon,goal:$('#hGoal').value,next:$('#hNext').value.trim(),resources:$('#hRes').value.trim(),notes:$('#hNotes').value.trim()});hobOpen=h.id;closeSheet();return true}
function delHobbyThing(){const e=editing;if(!e)return false;
  if(e.kind==='hobby'){const h=S.hobbies.find(x=>x.id===e.id);drop('hobbies',e.id);closeSheet();toast('Removed.',()=>put('hobbies',h));return true}
  if(e.kind==='hoblogedit'){const l=S.logs.find(x=>x.id===e.id);drop('logs',e.id);closeSheet();toast('Removed.',()=>put('logs',l));return true}
  return false}
function hobClick(b,d){
  if(d.hobopen){hobOpen=hobOpen===d.hobopen?null:d.hobopen;render();return true}
  if(d.hoblog!==undefined){const[id,m]=d.hoblog.split(':');logHobby(id,+m||0);return true}
  if(d.hobedit!==undefined){editHobby(d.hobedit||null);return true}
  if(d.hobwho){editing.who=d.hobwho;b.parentElement.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===b));return true}
  if(d.hobico){editing.icon=d.hobico;b.parentElement.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===b));return true}
  if(d.hobl){const l=S.logs.find(x=>x.id===d.hobl);if(!l)return true;editing={kind:'hoblogedit',id:l.id,hobby:l.hobby};sheet(`<h3>Practice</h3><div class="two"><label class="field"><span>Minutes</span><input id="hMins" type="number" min="1" value="${esc(l.mins||'')}" required></label><label class="field"><span>Day</span><input id="hDay" type="date" value="${esc(l.date||todayStr())}"></label></div><label class="field"><span>What you did</span><input id="hNote" value="${esc(l.note||'')}"></label><div class="actions">${delBtn()}<button class="btn primary">Save</button></div>`);return true}
  return false}
/* ---------- the Mallow ten icons, drawn from the Mallow set: flat marshmallows, burgundy outline ---------- */

 small:`${mm(8,54,26,22,'cream')}${mm(35,60,26,22,'rose')}${mm(62,54,26,22,'cream')}<path d="M36 32l8 8 16-20" ${MI_S}/>`};
const micon=(k,sz=48)=>`<svg class="micon" viewBox="0 0 96 96" width="${sz}" height="${sz}" aria-hidden="true">${MICONS[k]||''}</svg>`;
/* ========== The Mallow ten: Landing Pad, One Little Mallow, Squish, Bounce Back, Build Our Day, Soft Landing, Together, Room to Rise, Save for Later, Small Things Count ========== */
let ASSETS=null,SAMPLE=null,SAMPLE_IMG=false;
(async()=>{try{if(!(window.claude&&window.claude.use))return;const [a,s]=await Promise.all([window.claude.use('assets').catch(()=>null),window.claude.use('sample').catch(()=>null)]);ASSETS=a;SAMPLE=s;if(s){const l=await s.limits().catch(()=>null);SAMPLE_IMG=!!(l&&l.images)}render()}catch(e){}})();
const isLater=x=>!!x.later&&(x.status||'todo')!=='done';
const mondayStr=()=>{const t=todayStr();return addDays(t,-((isoDay(t)+6)%7))};
const blobSrc=n=>n.photo?'/_blob/'+n.photo:(n.photoData||'');
async function shrinkImage(file,max,q){try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q))}catch(e){return file}}
const toDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r('');f.readAsDataURL(b)});
const askCopy=c=>({not_granted:'Claude wasn’t allowed for this page, so this is off for now.',rate_limited:'Claude is busy just now. Try again in a little while.',sampling_disabled:'Claude isn’t available on this account.',image_rejected:'That photo couldn’t be read. Try a clearer one.',invalid_json:'That didn’t come back in a usable shape. Try again.',refused:'Claude couldn’t help with that one.'})[c]||'That didn’t work this time. Try again.';

/* ---------- 1. The Landing Pad ---------- */
function landingView(){const ib=inbox(),bag=S.tasks.filter(isLater).sort((a,b)=>(b.laterAt||0)-(a.laterAt||0));
  const media=n=>(blobSrc(n)?`<img class="lpimg" src="${esc(blobSrc(n))}" alt="${n.letter?'School letter photo':'Photo'}">`:'')+(n.audio?`<audio controls preload="none" src="/_blob/${esc(n.audio)}"></audio>`:'');
  const extract=n=>{if(n.reading)return '<p class="hint">Claude is reading the letter…</p>';if(n.readErr)return `<p class="hint">${esc(n.readErr)} <button class="ghost" data-lpread="${n.id}">Try again</button></p>`;const x=n.extract;if(!x)return n.letter&&SAMPLE_IMG&&n.photo?`<button class="btn quiet" data-lpread="${n.id}">${ico('scan-text',16)} Read this letter</button>`:'';
    return `<div class="lpx">${x.summary?`<p style="margin:0">${esc(x.summary)}</p>`:''}${(x.items||[]).map((it,i)=>`<div class="lpxi">${ico(it.kind==='date'?'calendar':'check-square',16)}<span>${esc(it.title)}${it.date?` · ${fd(it.date)}`:''}${it.who&&it.who!=='both'?` · ${esc(pname2(it.who))}`:''}</span>${it.added?`<small>Added</small>`:`<button class="cbtn" data-lpadd="${n.id}:${i}">Add</button>`}</div>`).join('')}${(x.items||[]).some(it=>!it.added)&&(x.items||[]).length>1?`<button class="ghost" data-lpadd="${n.id}:all" style="justify-self:start">Add them all</button>`:''}</div>`};
  return `<div class="view"><div class="hello"><div class="mhead">${micon('mail',64)}<div><div class="title">Mallow Mail</div><div class="kicker" style="font-size:18px">Inbox${ib.length?' · '+ib.length+' to sort':''}</div></div></div></div>
    <section class="section">${ib.length?`<div class="list">${ib.map(n=>`<div class="irow">${media(n)}${n.text?`<p>${esc(n.text)}</p>`:''}${extract(n)}<div class="iact"><button data-sort="task" data-sid="${n.id}">${ico('check-square',16)} Task</button><button data-sort="note" data-sid="${n.id}">${ico('sticky-note',16)} Note</button><button data-idone="${n.id}">${ico('check',16)} Done</button></div></div>`).join('')}</div>`:'<p class="empty">Nothing waiting. Tap + any time to get something out of your head.</p>'}</section>
    ${bag.length?`<section class="section"><div class="row"><h2 class="mh">${micon('later',32)} Save for later · ${bag.length}</h2></div><p class="hint" style="margin:0">Ideas and non-urgent jobs, safely in the bag. They stay off today’s view until you bring them back.</p>
      <div class="clist">${bag.map(x=>`<div class="crow ok" style="${cvar((catOf(x.cat)||{}).color||'slate')}"><button class="cm" data-edit-task="${x.id}">${esc(x.title)}<small>${esc((catOf(x.cat)||{}).name||'')}${x.laterAt?' · saved '+ago(new Date(x.laterAt).toISOString().slice(0,10)):''}</small></button><button class="cbtn" data-unlater="${x.id}">${ico('undo-2',14)} Bring back</button></div>`).join('')}</div></section>`:''}</div>`}
async function lpFile(kind,file){if(!file)return;const id=uid(),now=Date.now();
  try{if(kind==='voice'){if(!ASSETS){toast('Voice notes need the hub open in Claude.');return}const ty=/webm|ogg/.test(file.type)?'video/webm':'video/mp4';const up=await ASSETS.upload(file,{type:ty});put('notes',{id,kind:'inbox',text:'Voice note',audio:up.id,cat:'',created:now});toast('Voice note landed.');return}
    const small=await shrinkImage(file,1600,.75);let o={id,kind:'inbox',text:kind==='letter'?'School letter':'',letter:kind==='letter',cat:'',created:now};
    if(ASSETS){const up=await ASSETS.upload(small,{type:'image/jpeg'});o.photo=up.id}else{o.photoData=await toDataUrl(await shrinkImage(file,900,.6))}
    put('notes',o);toast(kind==='letter'?'Letter landed.':'Photo landed.');if(kind==='letter'&&SAMPLE_IMG)readLetter(id,small)}
  catch(e){toast(e&&e.code==='too_large'?'That file is too big.':'That didn’t upload. Try again.')}}
async function readLetter(id,blob){const n=S.notes.find(x=>x.id===id);if(!n||!SAMPLE)return;
  if(!blob){try{blob=await (await fetch(blobSrc(n))).blob()}catch(e){put('notes',{...n,readErr:'Couldn’t open the photo.'});return}}
  put('notes',{...n,reading:true,readErr:''});
  const prompt=`This photo shows a letter or notice, probably from a school, for a parent in Scotland. Her children are ${KIDS.map(k=>k.name).join(' and ')||'not named'}. In "who", use a child's first name in lower case. Today is ${todayStr()}.
Pull out what the parent needs to know and do. Reply with only JSON in this shape:
{"summary":"one plain sentence, under 25 words","items":[{"title":"short action or event, under 10 words","kind":"task or date","date":"YYYY-MM-DD or empty","who":"a child's first name, both or empty"}]}
A task is something the parent must do (return a slip, pay, send something in, book). A date is an event (trip, non-uniform day, parents' evening, holiday). Give a task the deadline as its date. At most 8 items. Use plain British English.`;
  try{const r=await SAMPLE.json(prompt,{images:[blob]});const items=(Array.isArray(r&&r.items)?r.items:[]).slice(0,8).map(it=>({title:String(it.title||'').slice(0,120),kind:it.kind==='date'?'date':'task',date:/^\d{4}-\d{2}-\d{2}$/.test(it.date||'')?it.date:'',who:({[(KIDS[0]||{}).name?.toLowerCase()]:'arran',[(KIDS[1]||{}).name?.toLowerCase()]:'caelan',both:'both'})[String(it.who||'').toLowerCase()]||''})).filter(it=>it.title);
    const cur=S.notes.find(x=>x.id===id);if(cur)put('notes',{...cur,reading:false,extract:{summary:String(r&&r.summary||'').slice(0,300),items}})}
  catch(e){const cur=S.notes.find(x=>x.id===id);if(cur)put('notes',{...cur,reading:false,readErr:askCopy(e&&e.code)})}}
function lpAdd(ref){const[id,which]=ref.split(':'),n=S.notes.find(x=>x.id===id);if(!n||!n.extract)return;const items=n.extract.items.map(x=>({...x}));const idx=which==='all'?items.map((_,i)=>i):[+which];let k=0;
  idx.forEach(i=>{const it=items[i];if(!it||it.added)return;const tags=it.who==='both'?['arran','caelan']:it.who?[it.who]:[];
    if(it.kind==='date'&&it.date)put('events',{id:uid(),title:it.title,date:it.date,who:it.who==='both'?'boys':(it.who||'all'),icon:guess(it.title),color:evColour(it.who==='both'?'boys':(it.who||'all'))});
    else put('tasks',{id:uid(),title:it.title,notes:'From a school letter'+(n.extract.summary?': '+n.extract.summary:''),cat:'kids',sec:'',status:'todo',due:it.date||'',tags,created:Date.now()+i,doneAt:''});
    it.added=true;k++});
  put('notes',{...n,extract:{...n.extract,items}});toast(k===1?'Added.':k+' added.')}

/* ---------- 2. One Little Mallow ---------- */
let olmSkip=[];
function olmCandidates(){const t=todayStr(),soon=addDays(t,3);
  const base=S.tasks.filter(x=>(x.status||'todo')!=='done'&&x.status!=='waiting'&&!x.later&&x.cat!=='work');
  const rank=x=>x.urgent?0:x.due&&x.due<=t?1:x.status==='doing'?2:x.due&&x.due<=soon?3:x.due?4:5;
  return base.sort((a,b)=>rank(a)-rank(b)||(a.due||'9').localeCompare(b.due||'9')||(a.created||0)-(b.created||0)).map(x=>{const st=(x.steps||[]).find(s=>!s.done);const sm=x.small&&x.small.date===t&&!x.small.done?x.small.text:'';
    return{x,text:sm||(st?st.text:x.title),step:!sm&&st?st.id:'',small:!!sm}}).filter(c=>c.text)}
function olmCard(){const cs=olmCandidates();let c=cs.find(z=>!olmSkip.includes(z.x.id));if(!c&&cs.length){olmSkip=[];c=cs[0]}
  if(!c)return `<section class="olm"><div class="mhead">${micon('olm',44)}<div class="kicker">One little mallow</div></div><div class="olm-t">Nothing needs you right now.</div><small class="hint">Rest counts too.</small></section>`;
  const parent=c.small||c.step?`Part of: ${c.x.title}`:'';
  return `<section class="olm" aria-label="One next step"><div class="mhead">${micon('olm',44)}<div class="kicker">One little mallow</div></div><div class="olm-t">${esc(c.text)}</div>${parent?`<small class="hint">${esc(parent)}</small>`:''}
    <div class="olm-b"><button class="btn primary" data-olmdone="${c.x.id}:${c.step}:${c.small?1:''}">${ico('check',18)} Done</button><button class="btn quiet" data-squish="${c.x.id}">${ico('blocks',18)} Squish it</button><button class="btn quiet" data-olmskip="${c.x.id}">${ico('shuffle',18)} Not this one</button><button class="btn quiet" data-later="${c.x.id}">${ico('briefcase',18)} Save for later</button></div>
    <p class="hint" style="margin:0">Big jobs become small building blocks.</p></section>`}
function olmDone(ref){const[id,step,small]=ref.split(':'),x=S.tasks.find(t=>t.id===id);if(!x)return;
  if(small){put('tasks',{...x,small:{...x.small,done:true}});winLog('piece',x.small.text);toast('Done. That piece counts.');return}
  if(step){const steps=(x.steps||[]).map(s=>s.id===step?{...s,done:true}:s);const all=steps.every(s=>s.done);put('tasks',{...x,steps,...(all?{status:'done',doneAt:todayStr()}:{})});winLog('piece',(x.steps||[]).find(s=>s.id===step)?.text||'');const nx=steps.find(s=>!s.done);toast(all?`Done. That’s all of ${x.title}.`:`Done. Next: ${nx.text}`);return}
  moveTask(id,'done')}

/* ---------- 3. Squish the Task ---------- */
function squish(id){const x=S.tasks.find(t=>t.id===id);if(!x)return;const t=todayStr();editing={kind:'squish',id,energy:'some'};
  sheet(`<div class="mhead">${micon('squish',48)}<h3>Squish the task</h3></div><p style="margin:0"><b>${esc(x.title)}</b></p><p class="hint" style="margin:0">Change the shape to fit what you’ve got today.</p>
  <label class="field"><span>Just today’s piece (the smallest bit you can do today)</span><input id="sqSmall" value="${x.small&&x.small.date===t&&!x.small.done?esc(x.small.text):''}" placeholder="Today I’ll just find the letter"></label>
  <label class="field"><span>Or break it into small pieces, one per line</span><textarea id="sqSteps" rows="6" placeholder="Find the letter&#10;Fill in page 1&#10;Put it in the school bag">${esc((x.steps||[]).filter(s=>!s.done).map(s=>s.text).join('\n'))}</textarea></label>
  ${SAMPLE?`<div class="field"><span>How much have you got in you today?</span><div class="seg" role="group">${[['low','Not much'],['some','Some'],['plenty','Plenty']].map(([k,n])=>`<button type="button" data-sqen="${k}" aria-pressed="${k==='some'}">${n}</button>`).join('')}</div></div>
  <button type="button" class="btn quiet" id="sqAsk" style="justify-self:start">${ico('sparkles',16)} Ask Claude for small pieces</button><p class="hint" id="sqMsg" aria-live="polite" style="margin:0"></p>`:''}
  <div class="actions"><span></span><button class="btn primary">Save</button></div>`)}
let sqCtl=null;
async function squishAsk(){const e=editing;if(!e||e.kind!=='squish'||!SAMPLE)return;const x=S.tasks.find(t=>t.id===e.id);const msg=$('#sqMsg'),btn=$('#sqAsk');msg.textContent='Thinking…';btn.disabled=true;sqCtl=new AbortController();
  const size={low:'Each piece takes 5 minutes or less, and the first piece is tiny.',some:'Each piece takes about 10 to 15 minutes.',plenty:'Pieces can take up to 30 minutes.'}[e.energy];
  try{const r=await SAMPLE.json(`Help a busy, neurodivergent single parent break one job into small, concrete, physical steps. ${size} Use 3 to 6 steps, each under 12 words, starting with a verb, in plain British English. No advice, no extra words.
Also give "today": the single smallest first step that is realistic today.
Reply with only JSON: {"steps":["..."],"today":"..."}
The job: ${x.title}${x.notes?'\nNotes: '+x.notes:''}`,{modelTier:'quick',signal:sqCtl.signal});
    const steps=(Array.isArray(r&&r.steps)?r.steps:[]).map(s=>String(s).trim()).filter(Boolean).slice(0,8);if($('#sqSteps')&&steps.length)$('#sqSteps').value=steps.join('\n');if($('#sqSmall')&&!$('#sqSmall').value&&r&&r.today)$('#sqSmall').value=String(r.today).slice(0,120);msg.textContent=steps.length?'Here are some pieces. Change any of them, then save.':'Nothing came back. Try again.'}
  catch(err){if(msg)msg.textContent=err&&err.code==='cancelled'?'':askCopy(err&&err.code)}finally{if(btn)btn.disabled=false}}
function saveSquish(){const e=editing;if(!e||e.kind!=='squish')return false;const x=S.tasks.find(t=>t.id===e.id);if(!x){closeSheet();return true}
  const small=$('#sqSmall').value.trim(),lines=$('#sqSteps').value.split('\n').map(z=>z.trim()).filter(Boolean),old=x.steps||[];
  const steps=[...old.filter(s=>s.done),...lines.map(text=>{const m=old.find(s=>!s.done&&s.text===text);return m||{id:uid(),text,done:false}})];
  const o={...x,steps};if(small)o.small={text:small,date:todayStr(),done:false};if(lines.length>=2)o.ttype='project';
  put('tasks',o);closeSheet();toast(small?'Squished. Today it’s just: '+small:lines.length?`Squished into ${lines.length} pieces.`:'Saved.');return true}

/* ---------- 4. Bounce Back ---------- */
let bb=null;
const carriedOver=()=>{const t=todayStr();return S.tasks.filter(x=>(x.status||'todo')!=='done'&&!x.later&&x.due&&x.due<t).sort((a,b)=>a.due.localeCompare(b.due))};
function quietDays(){const t=todayStr(),since=addDays(t,-4);return !S.tasks.some(x=>(x.doneAt||'')>=since)&&!S.ticks.some(k=>(k.id||'').slice(0,10)>=since)&&!S.logs.some(l=>l.kind==='win'&&(l.date||'')>=since)}
function bounceNudge(){const n=carriedOver().length;return n>=3||(quietDays()&&S.tasks.some(x=>(x.status||'todo')!=='done'))?`<button data-bounce style="${cvar('lilac')}">${ico('refresh-ccw',16)} Bounce back: a gentle fresh start${n?` (${n} carried over)`:''}</button>`:''}
function bounceStart(){const l=carriedOver().slice(0,12);bb={ids:l.map(x=>x.id),i:0,kept:0,later:0,gone:0,squish:[]};drawBounce()}
function drawBounce(){const L=$('#layer');if(!bb){L.innerHTML='';return}const x=S.tasks.find(t=>t.id===bb.ids[bb.i]);
  if(!x){L.innerHTML=`<div class="soft" role="dialog" aria-label="Bounce back"><div class="soft-in">${micon('bounce',72)}<div class="kicker">Bounce back</div><div class="title">A fresh start</div>
    <p>${bb.ids.length?`You looked at ${bb.ids.length} thing${bb.ids.length===1?'':'s'}. ${bb.kept} kept for this week, ${bb.later} saved for later, ${bb.gone} let go.`:'Nothing was carried over. You’re already starting fresh.'}</p>
    <p>Your list is still here. Tomorrow is a fresh start too.</p>${bb.squish.length?`<button class="btn quiet" data-squish="${bb.squish[0]}">${ico('blocks',16)} Squish the one you picked</button>`:''}<button class="btn primary" data-bbclose>Back to Casa Mallow</button></div></div>`;paintIcons(L);return}
  const c=catOf(x.cat);
  L.innerHTML=`<div class="soft" role="dialog" aria-label="Bounce back"><div class="soft-in">${micon('bounce',56)}<div class="kicker">Bounce back · ${bb.i+1} of ${bb.ids.length}</div><div class="title" style="font-size:28px">${esc(x.title)}</div>
    <p class="hint" style="margin:0">${c?esc(c.name)+' · ':''}was due ${fd(x.due)}</p><p style="margin:0">Does this still matter?</p>
    <div class="bbb"><button class="btn primary" data-bb="keep">${ico('calendar-check',18)} Yes, this week</button><button class="btn quiet" data-bb="squish">${ico('blocks',18)} Yes, but squish it</button><button class="btn quiet" data-bb="later">${ico('briefcase',18)} Save for later</button><button class="btn quiet" data-bb="go">${ico('feather',18)} Let it go</button></div>
    <button class="ghost" data-bbclose style="justify-self:center">Stop here for now</button></div></div>`;paintIcons(L)}
function bounceAct(a){const x=S.tasks.find(t=>t.id===bb.ids[bb.i]);if(x){const t=todayStr();
  if(a==='keep'||a==='squish'){put('tasks',{...x,due:addDays(t,1+Math.floor(bb.kept/2))});bb.kept++;if(a==='squish')bb.squish.push(x.id)}
  if(a==='later'){put('tasks',{...x,later:true,laterAt:Date.now()});bb.later++}
  if(a==='go'){put('tasks',{...x,status:'done',doneAt:t,letGo:true});bb.gone++}}
  bb.i++;if(bb.i>=bb.ids.length)winLog('return','Bounced back');drawBounce()}

/* ---------- 5 + 8. Build Our Day and Room to Rise ---------- */
const roomDoc=()=>S.settings.find(x=>x.id==='room')||{id:'room',buf:10};
const QB={appt:['Appointment','calendar-clock',60],meal:['Meal','utensils',30],task:['Task','check-square',30],rest:['Rest','sofa',20]};
function freeSlot(day,dur){const buf=+roomDoc().buf||10,t=todayStr();let c=day===t?Math.ceil((nowMins()+5)/5)*5:7*60;const its=itemsFor(day).filter(i=>i.s!=null&&i.e!=null).sort((a,b)=>a.s-b.s);
  for(const it of its){if(it.e<=c)continue;if(c+dur+buf<=it.s)return c;c=Math.max(c,it.e+buf)}return Math.min(c,23*60)}
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function quickBlock(k){const[n,icon,dur]=QB[k];const s=freeSlot(viewDay||todayStr(),dur);editBlock(null);
  const ti=$('#fTitle');if(ti){if(k==='rest'||k==='meal')ti.value=n;ti.placeholder=n==='Task'?'What you’ll work on':n}$('#fStart').value=hhmm(s);$('#fEnd').value=hhmm(s+dur);editing.icon=icon;editing.iconTouched=true;markIcon()}
function roomToRise(day){const buf=+roomDoc().buf||10,t=todayStr();const from=day===t?Math.max(7*60,nowMins()):7*60,to=21*60;
  const its=itemsFor(day).filter(i=>i.s!=null&&i.e!=null&&i.e>from&&i.s<to).sort((a,b)=>a.s-b.s);let c=from,free=0;const tight=[];
  its.forEach((it,k)=>{if(it.s>c)free+=it.s-c;const nx=its[k+1];if(nx&&nx.s-it.e<buf&&nx.s>=it.s)tight.push(it.title);c=Math.max(c,it.e)});if(to>c)free+=to-c;
  return{free,tight,buf,from}}
function roomCard(day){if(!day)return '';const r=roomToRise(day),h=Math.floor(r.free/60),m=r.free%60;if(day===todayStr()&&nowMins()>=21*60)return `<div class="rbox" style="${cvar('mint')}"><div class="rh">${micon('room',32)}<h2>Room to rise</h2></div><p class="hint" style="color:var(--ink);margin:0">The day is done. Nothing more needs to fit in tonight.</p></div>`;
  return `<div class="rbox" style="${cvar('mint')}"><div class="rh">${micon('room',32)}<h2>Room to rise</h2><button class="ghost" id="roomSet">${r.buf} min gaps</button></div>
    <p class="hint" style="color:var(--ink);margin:0"><b>${h?h+' hr ':''}${m||!h?m+' min':''}</b> spare ${day===todayStr()&&nowMins()>=7*60?'from now ':'from 7am '}until 9pm.${r.tight.length?` No breathing room after ${esc(r.tight.slice(0,3).join(', '))}. Everything needs a little space.`:' Every block has room around it.'}</p>
    <div class="nudges">${Object.entries(QB).map(([k,[n,i]])=>`<button data-qb="${k}">${ico(i,16)} ${n}</button>`).join('')}${day===todayStr()&&blocksFor(day).some(b=>b.s>=nowMins())?`<button data-pushday>${ico('clock-arrow-down',16)} Running late? Push the rest back 15 min</button>`:''}</div></div>`}
function pushDay(){const t=todayStr(),nm=nowMins();let n=0;blocksFor(t).filter(b=>b.s>=nm).forEach(b=>{const o=S.blocks.find(x=>x.id===b.id);if(!o)return;const st=hhmm(b.s+15),en=o.end?hhmm(b.e+15):'';
  if(o.date)put('blocks',{...o,start:st,end:en});else{put('blocks',{...o,skip:[...(o.skip||[]),t]});put('blocks',{...o,id:uid(),days:[],date:t,skip:[],start:st,end:en,from:o.id})}n++});toast(n?`Moved ${n} thing${n===1?'':'s'} back 15 minutes.`:'Nothing to move.')}
