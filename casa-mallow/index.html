function sitOpen(id){const n=S.notes.find(x=>x.id===id);const L=$('#layer');L.innerHTML=`<div class="soft" role="dialog" aria-label="Sitting together"><div class="soft-in" style="text-align:center">${micon('together',72)}<div class="kicker">Mallow together</div><div class="title">Sitting together</div><p>${n?esc(pname2(n.from)||'Someone')+(n.text?': '+esc(n.text):''):''}</p><p class="hint" style="margin:0">Starting is the hardest part. You don’t have to finish, just begin.</p>
  <div class="seg" role="group" style="max-width:320px;margin:0 auto">${[10,15,25].map(m=>`<button data-sitm="${m}" aria-pressed="false">${m} min</button>`).join('')}</div><div class="sitclock" id="sitClock" aria-live="polite"></div><button class="btn primary" data-sitend="${id}">We did it</button><button class="ghost" data-slclose>Close</button></div></div>`;paintIcons(L)}
let sitT=null;function sitStart(m){let left=m*60;clearInterval(sitT);const tick=()=>{const e=$('#sitClock');if(!e){clearInterval(sitT);return}e.textContent=left>0?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'Time’s up. Well started.';if(left<=0)clearInterval(sitT);left--};tick();sitT=setInterval(tick,1000)}

/* ---------- 10. Small Things Count ---------- */
const WINS=[['call','Made a call','phone'],['help','Asked for help','hand-helping'],['rest','Rested','bed'],['return','Came back to something','refresh-ccw']];

function smallHTML(){const n=smallThings(),shown=Math.min(n,40);const rows=[];for(let r=0;r*8<shown;r++)rows.push(Array.from({length:Math.min(8,shown-r*8)},(_,k)=>`<i class="${(r+k)%2?'c':'r'}${r*8+k===shown-1&&smallBounce?' squish':''}"></i>`).join(''));smallBounce=false;

    <div class="nudges">${WINS.map(([k,n,i])=>`<button data-win="${k}">${ico(i,16)} ${n}</button>`).join('')}<button data-win="other">${ico('plus',16)} Something else</button></div>
    <p class="hint" style="margin:0">Making a call, asking for help, resting and coming back to something all count. Small pieces still build something meaningful.</p></section>`}
let smallBounce=false;

/* ---------- clicks, saves and inputs for all ten ---------- */
function mallowClick(b,d){

  if(d.unlater){const x=S.tasks.find(t=>t.id===d.unlater);if(x){const {later,laterAt,...rest}=x;put('tasks',{...rest,later:false});toast('Back on your board.')}return true}
  if(d.later){const x=S.tasks.find(t=>t.id===d.later);if(x){put('tasks',{...x,later:true,laterAt:Date.now()});closeSheet();toast('Saved for later. It’s in the bag in your Inbox.',()=>put('tasks',x))}return true}
  if(d.olmdone){olmDone(d.olmdone);return true}
  if(d.olmskip){olmSkip.push(d.olmskip);render();return true}

  if(d.sqen){editing.energy=d.sqen;b.parentElement.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===b));return true}
  if(b.id==='sqAsk'){squishAsk();return true}

  if(d.bb){bounceAct(d.bb);return true}
  if(d.bbclose!==undefined){bb=null;$('#layer').innerHTML='';render();return true}
  if(d.qb){quickBlock(d.qb);return true}
  if(d.pushday!==undefined){pushDay();return true}
  if(b.id==='roomSet'){editing={kind:'roomset'};sheet(`<h3>Room to rise</h3><div class="field"><span>Breathing room between things</span><div class="seg" role="group">${[5,10,15,20].map(m=>`<button type="button" data-rbuf="${m}" aria-pressed="${(+roomDoc().buf||10)===m}">${m} min</button>`).join('')}</div></div><p class="hint">New blocks you add get this much space around them.</p><div class="actions"><span></span><button class="btn primary">Save</button></div>`);editing.buf=+roomDoc().buf||10;return true}
  if(d.rbuf){editing.buf=+d.rbuf;b.parentElement.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===b));return true}
  if(d.softland!==undefined){softOpen();return true}

    const latest=ds.map(x=>x.charge.last||'').sort().pop()||'',ev=+ds[0].charge.every||1,gnext=latest?addDays(latest,ev):t;

/* ---------- Alexa: bedtime announcements follow the timetable ---------- */
const BEDRE=/\bbed(time)?\b/i;
function alexaPlan(){const t=todayStr(),plan={};
  for(let k=0;k<21;k++){const d=addDays(t,k),out=[];
    const away=visitsOn(d).some(v=>+v.days>0)||coveredOn(d).some(v=>v.endAt.slice(0,10)>d);
    if(!away){const beds=kidItems(d,null).filter(x=>BEDRE.test(x.title||'')&&x.src!=='dad');const byT={};
      beds.forEach(x=>{(byT[x.start]=byT[x.start]||new Set()).add(!x.who||x.who==='both'?'both':x.who)});
      Object.entries(byT).forEach(([tm,w])=>{const who=w.has('both')||(w.has('arran')&&w.has('caelan'))?'boys':kidOf([...w][0]).name;
        out.push({bed:tm,at:addMins(tm,-15),text:`Fifteen minutes until bedtime, ${who}. Time to start winding down.`})})}
    blocksFor(d).filter(b=>BEDRE.test(b.title||'')).forEach(b=>out.push({bed:b.start,at:addMins(b.start,-15),text:'Fifteen minutes until your bedtime. Time to wind down.'}));
    const bn=binsOn(addDays(d,1));if(bn.length)out.push({at:addMins(binDoc().eve||'19:00',0),bed:'',text:`Bin night. Tomorrow is ${bn.map(b=>b.name.toLowerCase()).join(' and ')}. Time to put ${bn.length>1?'them':'it'} out.`});
    if(out.length)plan[d]=out.sort((a,b)=>a.at.localeCompare(b.at))}
  return plan}
function morningPlan(){const t=todayStr(),plan={};
  for(let k=0;k<22;k++){const d=addDays(t,k);if(coveredOn(d).length)continue;
    const its=kidItems(d,null),sch=its.find(x=>/\bschool\b/i.test(x.title||'')&&!/to school|for school/i.test(x.title||''));if(!sch)continue;
    const lv=its.find(x=>/(car|walk|bus|taxi|leave|drive).*school|^leave\b/i.test(x.title||'')&&mins(x.start)<=mins(sch.start))||blocksFor(d).find(b=>/leave.*school/i.test(b.title||''));
    const leave=lv?lv.start:addMins(sch.start,-30);plan[d]={leave,at:addMins(leave,-15),text:'Good morning! Fifteen minutes until we leave for school. Time for shoes, coats and bags.'}}
  return plan}
const addMins=(tm,n)=>{let m=mins(tm)+n;m=Math.max(0,m);m=Math.floor(m/15)*15;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

  sH=Math.max(0,sH);eH=Math.min(24,Math.max(eH,sH+1));
  const y=m=>(m-sH*60)/60*HOUR;
  const sorted=[...items].sort((a,b)=>a.s-b.s||b.e-a.e);const clusters=[];let cur=[],curEnd=-1;
  sorted.forEach(x=>{if(cur.length&&x.s>=curEnd){clusters.push(cur);cur=[];curEnd=-1}cur.push(x);curEnd=Math.max(curEnd,x.e)});if(cur.length)clusters.push(cur);
  const pos=new Map();clusters.forEach(cl=>{const cols=[];cl.forEach(x=>{let c=cols.findIndex(end=>end<=x.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=x.e;pos.set(x,c)});cl.forEach(x=>pos.set(x,[pos.get(x),cols.length]))});
  let hours='';for(let h=sH;h<=eH;h++){const lab=h===0||h===24?'12am':h===12?'12pm':h<12?h+'am':(h-12)+'pm';hours+=`<div class="hr" style="top:${y(h*60)}px"><span>${lab}</span></div>`}
  const evs=sorted.map(x=>{const[c,n]=pos.get(x);const top=y(x.s)+1,h=Math.max(y(x.e)-y(x.s)-2,28);const short=h<46;
    const done=isDone(viewDay,x.id),past=isToday&&x.e<=nm,curr=isToday&&x.s<=nm&&nm<x.e;
    const sub=`${nice(x.start)}${x.end?'–'+nice(x.end):''}${x.kind==='gcal'&&x.cal?' · '+esc(x.cal):''}`;
    const open=x.kind==='gcal'?`data-gev="${x.id}" data-gday="${viewDay}"`:`data-edit-block="${x.id}"`;
    return `<div class="ev ${x.kind} ${short?'short':''} ${curr?'current':''} ${past||done?'past':''} ${done?'isdone':''}" style="top:${top}px;height:${h}px;left:calc(${c} * 100% / ${n});width:calc(100% / ${n});${styleOf(x)}">
      <button class="evb" ${open} aria-label="${esc(x.title)}, ${sub.replace(/<[^>]*>/g,'')}"><span class="ei">${ico(x.icon||guess(x.title),16)}</span><span class="etx"><span class="et">${esc(x.title)}</span><span class="es">${sub}</span></span></button>
      ${n<2?`<button class="tick ${done?'on':''}" data-tick-block="${x.id}" aria-label="${done?'Untick':'Tick off'} ${esc(x.title)}"><i>${done?'✓':''}</i></button>`:''}</div>`}).join('');
  const nowbar=isToday&&nm>=sH*60&&nm<=eH*60?`<div class="nowbar" style="top:${y(nm)}px" aria-hidden="true"></div>`:'';
  return `<div class="tl" style="height:${(eH-sH)*HOUR}px">${hours}<div class="lane">${evs}</div>${nowbar}</div>`;
}
function nowCard(b,nm){

/* ---------- board ---------- */

let boardMode=(()=>{try{return localStorage.getItem('hubBoardMode')||'urgent'}catch(e){return 'urgent'}})();

function priorityBoard(shown){const open=shown.filter(x=>(x.status||'todo')!=='done'&&x.ttype!=='project');const wait=open.filter(x=>x.status==='waiting'),act=open.filter(x=>x.status!=='waiting');
  const B=[['now','Do now','zap','rose','Urgent, carried over, or due in the next 2 days.'],['soon','Soon','clock','sun','Due in the next 2 weeks, or already started.'],['later','Whenever','coffee','slate','No rush. Pick one when you have a moment.']];

    ${wait.length?`<details class="section"><summary class="hint" style="cursor:pointer">Waiting on someone else · ${wait.length}</summary><div class="list" style="margin-top:8px">${wait.map(x=>card(x)).join('')}</div></details>`:''}</div>`}

      ${st.length?`<div class="cbar"><i style="width:${Math.round(dn/st.length*100)}%"></i></div><p class="hint">${dn} of ${st.length} steps done${nx?` · next: <b style="color:var(--ink)">${esc(nx.text)}</b>`:''}</p>
      <div>${st.map(z=>`<button class="ditem ${z.done?'on':''}" data-pstep="${x.id}:${z.id}"><i class="bx">${z.done?'✓':''}</i><span>${esc(z.text)}</span></button>`).join('')}</div>
      ${nx?`<button class="ghost" data-pnext="${x.id}" style="justify-self:start">${ico('arrow-right',14)} Make “${esc(nx.text)}” a task</button>`:''}`:`<p class="hint">No steps yet. Tap the title to break it into small steps.</p>`}
      ${x.notes?`<p class="hint">${esc(x.notes)}</p>`:''}</section>`}).join('')}</div>`:'<p class="empty">No bigger projects yet. When adding a task, open it and choose “Bigger project” for things like sorting the loft.</p>'}
function prioClick(b,d){

function openRunner(id){const r=S.routines.find(x=>x.id===id);if(!r)return;let p=progressOf(r);if(p>=r.steps.length)p=0;runner={id,step:p};saveProgress();drawRunner()}
function saveProgress(){const r=S.routines.find(x=>x.id===runner.id);if(r){const o={...r,progressDate:todayStr(),progressStep:runner.step};S.routines[S.routines.findIndex(x=>x.id===r.id)]=o;if(db){const{id,...b}=o;db.collection('routines').doc(id).set(b).catch(fail)}else local.save()}}
function drawRunner(){
  const r=S.routines.find(x=>x.id===runner?.id);const L=$('#layer');if(!r){L.innerHTML='';runner=null;return}
  const n=r.steps.length,i=runner.step,done=i>=n;let clock='';
  if(r.leave&&!done){const left=mins(r.leave)-nowMins();clock=left>0?`${dur(left)} until you leave · ${n-i} step${n-i===1?'':'s'} left`:left===0?'Time to leave':`Leave time was ${nice(r.leave)}`}
  L.innerHTML=`<div class="runner" role="dialog" aria-label="${esc(r.name)}" style="${cstyle(r.cat)}">
    <div class="top"><div class="row"><span class="rname">${esc(r.name)}</span><button class="close" data-close-runner>Close</button></div>
      <div class="dots">${r.steps.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div></div>

      `<span class="big-icon">${ico(guess(r.steps[i]),50)}</span><div class="count">Step ${i+1} of ${n}</div><div class="step">${esc(r.steps[i])}</div>
      ${r.steps[i+1]?`<div class="then">Then: ${esc(r.steps[i+1])}</div>`:''}${clock?`<div class="clock">${clock}</div>`:''}`}</div>
    <div class="bottom">${done?'<button class="next-btn" data-close-runner>Close</button>':`<button class="next-btn" data-runner-next>${i===n-1?'Finish ✓':'Done →'}</button>`}

  paintIcons(L);
}

    updTrip(c=>{c.money=c.money||[];const i=c.money.findIndex(x=>x.id===o.id);if(i>=0)c.money[i]=o;else c.money.push(o)});closeSheet();return}

  if(editing.kind==='event'){const title=$('#fTitle').value.trim(),date=$('#fDate').value;if(!title){$('#fTitle').focus();return}if(!date){$('#fDate').focus();return}

  if(editing.kind==='sort'){const title=$('#fTitle').value.trim();if(!title){$('#fTitle').focus();return}

  if(editing.kind==='info'){const info=$('#fInfo').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(':');return i>0&&i<60?{label:l.slice(0,i).trim(),value:l.slice(i+1).trim()}:{label:'',value:l}});
    put('areas',{...areaDoc(editing.cid),id:editing.cid,info,keywords:$('#fKw').value.trim(),sections:$('#fSecs').value.split(',').map(x=>x.trim()).filter(Boolean)});closeSheet();return}
  if(editing.kind==='rot'){put('settings',{id:'rotation',weeks:editing.weeks,anchor:addDays(mondayOf(todayStr()),-7*(editing.cur-1))});closeSheet();toast('Rotation saved.');return}
  if(editing.kind==='calpick'){put('settings',{...settingsDoc(),id:'main',gcalIds:editing.ids});closeSheet();return}
  if(editing.kind==='gev'){closeSheet();return}
  if(editing.kind==='cats'){syncCatNames();editing.removed.forEach(id=>drop('cats',id));
    editing.list.forEach((c,i)=>{const name=c.name.trim();if(!name)return;const old=catOf(c.id);const o={...c,name,order:i+1};if(!old||old.name!==o.name||old.color!==o.color||old.order!==o.order)put('cats',o)});
    if(filter!=='all'&&!catOf(filter))filter='all';closeSheet();return}

  if(editing.kind==='person'){const a=areaDoc(editing.cid),ps=[...(a.people||[])],i=ps.findIndex(x=>x.id===editing.id),p={id:editing.id||uid(),name:title,notes:$('#fPNotes').value.trim()};

    if(t)put('kidtpl',{...t,name:title,color:editing.color});
    else{const id=uid();put('kidtpl',{id,name:title,color:editing.color,order:Math.max(0,...S.kidtpl.map(x=>x.order||0))+1,items:[]});tplOpen=id}

  if(editing.kind==='kitem'){const start=$('#fStart').value;if(!start){$('#fStart').focus();return}

function moveTask(id,to){const x=S.tasks.find(t=>t.id===id);if(!x||(x.status||'todo')===to)return;const before={...x};
  if(to==='done'&&+x.repeat){const o=nextRound(x);put('tasks',o);toast('Done. Next: '+dueLabel(o.due).replace(/^Due /,''),()=>put('tasks',before));return}
  put('tasks',{...x,status:to,doneAt:to==='done'?todayStr():''});
  if(to==='done'&&x.parent){const pr=S.tasks.find(t=>t.id===x.parent);if(pr)put('tasks',{...pr,steps:(pr.steps||[]).map(z=>z.id===x.step?{...z,done:true}:z)})}

    if(editing.kind==='event'){const ev=S.events.find(x=>x.id===editing.id);drop('events',editing.id);closeSheet();toast('Removed.',()=>put('events',ev));return}
    if(editing.kind==='note'){const n=S.notes.find(x=>x.id===editing.id);drop('notes',editing.id);closeSheet();toast('Note deleted.',()=>put('notes',n));return}
    if(editing.kind==='person'){const a=areaDoc(editing.cid);put('areas',{...a,people:(a.people||[]).filter(x=>x.id!==editing.id)});closeSheet();toast('Card removed.',()=>put('areas',a));return}
    if(editing.kind==='tpl'){if(S.kidtpl.length<2){toast('Keep at least one day type.');return}const old=tplOf(editing.id);drop('kidtpl',editing.id);tplOpen=null;closeSheet();toast('Day type deleted.',()=>{put('kidtpl',old);tplOpen=old.id});return}
    if(editing.kind==='kitem'){
      if(editing.mode==='tpl'){const t=tplOf(editing.tpl);put('kidtpl',{...t,items:(t.items||[]).filter(x=>x.id!==editing.id)});closeSheet();toast('Removed.',()=>put('kidtpl',t))}
      else{const before=kdOf(editing.day),kd={id:editing.day,tpl:'',hide:[],add:[],...(before||{})};
        saveKd(editing.src==='day'?{...kd,add:kd.add.filter(x=>x.id!==editing.id)}:{...kd,hide:[...kd.hide,editing.id]});closeSheet();toast('Removed for this day.',()=>before?put('kidday',before):drop('kidday',kd.id))}
      return}
    const col={task:'tasks',block:'blocks',routine:'routines'}[editing.kind];const old=S[col].find(x=>x.id===editing.id);
    drop(col,editing.id);closeSheet();toast('Deleted.',()=>put(col,old));return}
  if(d.run){openRunner(d.run);return}
  if(d.runnerNext!==undefined){runner.step++;saveProgress();drawRunner();return}
  if(d.runnerBack!==undefined){runner.step=Math.max(0,runner.step-1);saveProgress();drawRunner();return}
  if(d.closeRunner!==undefined){runner=null;$('#layer').innerHTML='';render();return}
});
/* drag and drop between columns (mouse); on phones use the arrow buttons */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-card]');if(!c)return;dragId=c.dataset.card;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
document.addEventListener('dragend',e=>{e.target.closest?.('[data-card]')?.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-col]');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('[data-col]');if(!col||!dragId)return;e.preventDefault();col.classList.remove('over');moveTask(dragId,col.dataset.col);dragId=null});
/* keep the column pills in step with swiping */
document.addEventListener('scroll',e=>{if(!e.target.classList?.contains('board'))return;const bd=e.target;const cols=[...bd.querySelectorAll('.col')];let best=0,bd0=Infinity;
  cols.forEach((c,i)=>{const dd=Math.abs(c.offsetLeft-bd.scrollLeft-bd.offsetLeft);if(dd<bd0){bd0=dd;best=i}});boardCol=KCOLS[best].k;document.querySelectorAll('.colnav button').forEach((x,i)=>x.classList.toggle('on',i===best))},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='gAdd'){e.preventDefault();grocAdd();return}if(e.key==='Enter'&&e.target&&e.target.id==='vAdd'){e.preventDefault();vAdd();return}if(e.key==='Enter'&&e.target&&e.target.id==='slTea'){e.preventDefault();$('#slTeaGo')?.click();return}if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.gin){e.preventDefault();giftAddFrom(e.target.dataset.gin);return}if(e.key==='Escape'){if(lookWho&&!lookFromKid){closeLook();return}if(kidView)return;if(runner){runner=null;$('#layer').innerHTML='';render()}else closeSheet()}});
setInterval(()=>{if(!$('#sheet')&&!dragId)render()},30000);
paintIcons(document.querySelector('nav'));paintIcons($('#capBtn'));
setView();boot();startGcal();
})();
</script>
